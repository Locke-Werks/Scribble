# Scribble configuration.
#
# Copy to scribble.toml next to where you run it, or to
# %LOCALAPPDATA%\Scribble\scribble.toml. Every key is optional and every one
# shown here is already the default, so an empty file behaves identically.
#
# Unknown keys are rejected rather than ignored. A typo here stops the program
# with a message instead of silently doing something else for an hour.

# -- paths --------------------------------------------------------------------
# Leave these unset and they resolve to per-user locations that are actually
# writable: transcripts in Documents\Scribble, everything else in
# %LOCALAPPDATA%\Scribble. Set them and they resolve against wherever you
# ran the program from.
#
# db_path is the important one. It is not a cache, it is the corpus: every
# transcript, every voiceprint, every name you typed. Lose it and your SRTs
# still exist, but the fact that speaker 4 on Tuesday is speaker 9 on Friday is
# gone forever. Back it up.
# out_dir   = "out"
# work_dir  = "work"
# db_path   = "scribble.db"
mirror_tree = true          # reproduce the input folder structure under out_dir
keep_work   = false         # keep decoded wavs after a file finishes

# -- transcription ------------------------------------------------------------
backend   = "whisper"       # whisper | parakeet
model     = "large-v3"      # see: scribble models
asr_accel = "auto"          # auto | cpu | cuda
language  = ""              # empty detects per file, naming it is faster
beam_size = 5

# Carrying context between windows means one hallucinated repetition propagates
# through the rest of a long recording. Off costs a little cross-window
# consistency and buys a lot less fiction.
condition_on_previous_text = false
temperature_fallback       = true

# Voice activity detection. Leave it on. Seriously.
#
# Whisper is a language model with an audio encoder taped to the front. Give it four
# minutes of room tone and it does what language models do: invents a fluent,
# confident, grammatically flawless sentence nobody said, then repeats it a
# hundred times, possibly in Norwegian. Ask me how I know. VAD stops those
# windows reaching the decoder at all. It is the only thing that works.
vad_filter = true

# The single highest return per second of effort in this entire file.
#
# Whisper has no hotword parameter, so these ride in on the initial prompt. They
# fix proper nouns, which are usually the only words anyone actually cares about
# to find. Names, places, jargon, that acronym your industry will not shut up
# about.
hotwords       = []
initial_prompt = ""

# -- source separation --------------------------------------------------------
# Strips music and background before transcription. Enormous on broadcast, field
# recordings and anything with a music bed. Slightly harmful on already clean
# speech, which is why "auto" measures the noise floor first instead of running
# it on everything and calling that a feature.
isolate                = "auto"        # never | auto | always
isolate_model          = "uvr-mdxnet"
isolate_accel          = "auto"        # auto | cpu | cuda
isolate_auto_threshold = 0.28

# -- diarization --------------------------------------------------------------
diarize    = true

# auto decides per stage from the hardware present, which is not the same as
# "use the GPU if there is one".
#
# Isolation is one large model over the whole recording, so the GPU always wins.
# Segmentation and voiceprints are small models run over hundreds of short
# windows, so they are launch-overhead bound: on a 16-core CPU they are faster
# on the CPU, on a four-core machine they are faster on the GPU. auto counts
# your cores. Set it explicitly if you disagree.
onnx_accel = "auto"                    # auto | cpu | cuda

# GPU acceleration for those stages needs cuDNN, which NVIDIA does not let
# anyone redistribute. prompt asks before downloading it, auto downloads without
# asking, never stays on CPU. Roughly 1.2 GB. See: scribble gpu
gpu_runtime = "prompt"                 # prompt | auto | never

segmentation_model = "pyannote-segmentation-3.0"
embedding_model    = "wespeaker-resnet293"

# -1 lets clustering decide. If you genuinely know the count, saying so bypasses
# thresholding entirely and is far more reliable than any tuning below.
num_speakers = -1
min_speakers = -1
max_speakers = -1

# -- corpus-wide speaker identity ---------------------------------------------
# Shortest turn allowed to contribute to a voiceprint. Two seconds of "yeah"
# tells you about the phoneme, not the person.
embed_min_segment  = 3.0
embed_max_segments = 8

# Cosine similarity above which a file's speaker joins an existing identity.
# Raise it if different people are being merged. Lower it if one person keeps
# splitting into several identities.
match_threshold  = 0.65

# Pairs landing between review and match get reported by `scribble dupes` for a
# human to judge, rather than silently merged or silently split. This must stay
# below match_threshold or the uncertain band is empty and nothing is ever
# reported, which looks exactly like everything being fine. The program refuses
# to start rather than let that happen.
review_threshold = 0.50

# Used by `scribble recluster`.
cluster_threshold = 0.65

# -- multi-track --------------------------------------------------------------
# For recordings where each channel is a separate microphone on a separate
# person. If that is what you have, turn this on, because it is free perfect
# diarization and better transcription.
#
# An ordinary stereo mix is NOT that. Both channels carry the same sources, and
# splitting one buys you two half transcripts of one conversation at double the
# processing time. I shipped this on by default exactly once. Never again.
split_channels       = false
max_split_channels   = 8
# How unlike each other two channels must be to count as separate microphones.
# Stereo content sits high because both channels carry everything. Independent
# microphones sit low, because each is dominated by whoever is nearest to it.
channel_independence = 0.35

# -- output -------------------------------------------------------------------
# srt | vtt | md | json | txt | tsv
formats   = ["srt", "md", "json"]
overwrite = false           # redo files already marked done
recursive = true
